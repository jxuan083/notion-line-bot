name: One-time encrypted desktop LINE transfer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Encrypt only the LINE credentials for the desktop
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          payload = json.dumps({k: os.environ[k] for k in ['LINE_TOKEN', 'LINE_USER_ID']}).encode()
          if not all(os.environ[k] for k in ['LINE_TOKEN', 'LINE_USER_ID']):
              raise SystemExit('Required LINE secrets missing')
          subprocess.run(['openssl','cms','-encrypt','-aes-256-cbc','-binary','-outform','DER','-out','line-credentials.cms','.github/desktop-transfer.crt'],input=payload,check=True)
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-desktop-line
          path: line-credentials.cms
          retention-days: 1
