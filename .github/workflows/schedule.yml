name: Notion Daily Cleanup and Push

on:
  schedule:
    # 台灣時間 07:42 (UTC 23:42)
    # 避開整點與半點尖峰，啟動速度最快
    - cron: "42 23 * * *"
  workflow_dispatch: # 保留手動觸發按鈕，方便測試

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        # 使用 npm install 安裝 package.json 中的 node-fetch 等套件
        run: npm install

      - name: Run script
        run: node index.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
